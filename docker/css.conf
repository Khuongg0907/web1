server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /style.css {
        add_header Cache-Control "no-cache";
        try_files /style.css =404;
    }

    location / {
        return 404;
    }
}
