ServerName mono-php
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Preserve REQUEST_URI (/api/...) for the router in database.php.
    RewriteEngine On
    RewriteRule ^/api/ /database.php [END]

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
