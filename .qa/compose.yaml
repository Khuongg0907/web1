name: mono-catalog-qa
services:
  html:
    image: mono-html:1.0.0
    ports:
      - "127.0.0.1:18089:80"
    depends_on:
      css:
        condition: service_healthy
      php:
        condition: service_healthy
  css:
    image: mono-css:1.0.0
  php:
    image: mono-php:1.0.0
    environment:
      MONO_DATA_DIR: /var/lib/mono
      MONO_ADMIN_TOKEN: qa-only-catalog-test-secret-2026
    volumes:
      - qa_data:/var/lib/mono
volumes:
  qa_data:
